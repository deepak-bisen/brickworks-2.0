########################################
# SERVER
########################################
server.port=${PORT:9191}

########################################
# EUREKA
########################################
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL}

########################################
# GATEWAY
########################################
spring.main.web-application-type=reactive

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

########################################
# GLOBAL CORS
########################################
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

########################################
# FORWARDED HEADERS
########################################
server.forward-headers-strategy=framework

########################################
# LOGGING
########################################
logging.level.root=INFO
logging.level.com.brickwork=INFO
logging.level.org.springframework.cloud.gateway=WARN

########################################
# ACTUATOR
########################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true