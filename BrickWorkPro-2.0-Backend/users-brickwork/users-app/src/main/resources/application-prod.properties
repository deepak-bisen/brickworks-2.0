#application-prod.properties
########################################

########################################
# SERVER
########################################
server.port=${PORT:8083}

########################################
# DATABASE
########################################
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

########################################
# JPA
########################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

########################################
# HIKARI CONNECTION POOL
########################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=UsersServicePool

########################################
# EUREKA
########################################
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL}

# Azure App Service public hostname
eureka.instance.hostname=${WEBSITE_HOSTNAME}
eureka.instance.preferIpAddress=false

# Advertise HTTPS externally
eureka.instance.nonSecurePortEnabled=false
eureka.instance.securePortEnabled=true
eureka.instance.securePort=443

# Public URLs used by Eureka
eureka.instance.homePageUrl=https://${WEBSITE_HOSTNAME}/
eureka.instance.statusPageUrl=https://${WEBSITE_HOSTNAME}/actuator/info
eureka.instance.healthCheckUrl=https://${WEBSITE_HOSTNAME}/actuator/health

########################################
# MAIL
########################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

########################################
# LOGGING
########################################
logging.level.root=INFO
logging.level.com.brickwork=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

########################################
# SPRING ACTUATOR
########################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
#Render and Kubernetes use readiness/liveness probes
management.endpoint.health.probes.enabled=true
