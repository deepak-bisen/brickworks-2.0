name: Deploy Products Service to Azure

on:
  push:
    branches:
      - production-ready
    paths:
      - 'BrickWorkPro-2.0-Backend/products-brickwork/**'
      - '.github/workflows/deploy-products-service.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build Products Service
        working-directory: BrickWorkPro-2.0-Backend
        run: mvn -B clean package -DskipTests -pl products-brickwork/products-app -am

      - name: Show generated JAR
        run: |
          echo "Products App target directory:"
          ls -lah products-brickwork/products-app/target/

          echo "JAR files:"
          find products-brickwork/products-app/target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -print

      - name: Copy JAR to deployment directory
        run: |
          mkdir -p deploy
          cp products-brickwork/products-app/target/*.jar deploy/app.jar

          echo "Deployment JAR:"
          ls -lah deploy/app.jar

      - name: Upload Products Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: products-service
          path: deploy/app.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Products Service JAR
        uses: actions/download-artifact@v4
        with:
          name: products-service
          path: deploy

      - name: Verify deployment JAR
        run: |
          echo "Downloaded files:"
          ls -lah deploy

          echo "JAR file:"
          file deploy/app.jar

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure App Service
        run: |
          az account show

          az webapp show \
            --name brickworkpro-products-service \
            --resource-group brickworkspro-rg \
            --query "{name:name,state:state,hostName:defaultHostName,location:location}" \
            --output table

      - name: Deploy Products Service to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: brickworkpro-products-service
          slot-name: Production
          package: ./deploy/app.jar
          type: jar
