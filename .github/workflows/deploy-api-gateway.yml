name: Deploy API Gateway to Azure

on:
  push:
    branches:
      - production-ready

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build API Gateway
        working-directory: BrickWorkPro-2.0-Backend/api-gateway
        run: mvn -B clean package -DskipTests

      - name: Show generated JAR
        run: |
          echo "Generated JAR:"
          find BrickWorkPro-2.0-Backend/api-gateway/target -maxdepth 1 -type f -name "*.jar" -print

      - name: Copy JAR to deployment directory
        run: |
          mkdir -p deploy
          cp BrickWorkPro-2.0-Backend/api-gateway/target/*.jar deploy/app.jar

          echo "Deployment JAR:"
          ls -lah deploy/app.jar

      - name: Upload API Gateway JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway
          path: deploy/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API Gateway JAR
        uses: actions/download-artifact@v4
        with:
          name: api-gateway
          path: deploy

      - name: Verify deployment JAR
        run: |
          echo "Downloaded files:"
          ls -lah deploy

          echo "JAR file:"
          file deploy/app.jar

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API Gateway to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: brickworkpro-api-gateway
          slot-name: Production
          package: deploy/app.jar
