name: Deploy Service Registry to Azure

on:
  push:
    branches:
      - production-ready

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build Service Registry
        working-directory: BrickWorkPro-2.0-Backend/service-registry-brickwork
        run: mvn clean package -DskipTests

      - name: Upload Service Registry JAR
        uses: actions/upload-artifact@v4
        with:
          name: service-registry
          path: BrickWorkPro-2.0-Backend/service-registry-brickwork/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Service Registry JAR
        uses: actions/download-artifact@v4
        with:
          name: service-registry
          path: ./deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AA52B559516D488ABF9082ACD41ECF7E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C459A945A9BA48CBF26BC9FC0A53ADB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CF09A9C15AC943078F072C99D7BF5F30A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: brickworkpro-service-registry
          slot-name: Production
          package: ./deploy/*.jar
