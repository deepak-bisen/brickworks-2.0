name: Deploy Service Registry to Azure

on:
  push:
    branches:
      - production-ready

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build Service Registry
        working-directory: BrickWorkPro-2.0-Backend/service-registry-brickwork
        run: mvn clean package -DskipTests

      - name: Show build output
        run: |
          echo "Service Registry target directory:"
          ls -lah BrickWorkPro-2.0-Backend/service-registry-brickwork/target/

          echo "JAR files:"
          find BrickWorkPro-2.0-Backend/service-registry-brickwork/target/ \
            -type f -name "*.jar" -print

      - name: Upload Service Registry JAR
        uses: actions/upload-artifact@v4
        with:
          name: service-registry
          path: BrickWorkPro-2.0-Backend/service-registry-brickwork/target/*.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Service Registry JAR
        uses: actions/download-artifact@v4
        with:
          name: service-registry
          path: deploy

      - name: Show downloaded files
        run: |
          echo "Current directory:"
          pwd

          echo "Downloaded files:"
          ls -lah deploy

          echo "JAR files:"
          find deploy -type f -name "*.jar" -print

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Service Registry to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: brickworkpro-service-registry
          slot-name: Production
          package: deploy
          type: jar
